name: Android Build & Sign

# Builds a release-signed APK using a base64-encoded keystore stored as a
# GitHub secret. Manual-only trigger — macos runner minutes are expensive
# but Linux minutes aren't, so this workflow is cheap to run.

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Output format"
        required: true
        default: "apk"
        type: choice
        options:
          - apk   # APK for sideload / direct distribution
          - aab   # Android App Bundle for Play Store
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type }} ${{ inputs.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Export NDK environment for Rust
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project (first run only)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            pnpm exec tauri android init
          fi

      - name: Sync app icons
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Decode keystore
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Write key.properties
        if: ${{ inputs.build_type == 'release' }}
        run: |
          cat > src-tauri/gen/android/key.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.keystore
          EOF
          # Sanity check — never leak the password itself
          grep -E '^(keyAlias|storeFile)=' src-tauri/gen/android/key.properties

      - name: Bump Android versionCode to unique per-run number
        run: |
          PROPS=src-tauri/gen/android/tauri.properties
          if [ -f "$PROPS" ]; then
            grep -v '^tauri.android.versionCode=' "$PROPS" > "$PROPS.new" || true
          else
            : > "$PROPS.new"
          fi
          echo "tauri.android.versionCode=${{ github.run_number }}" >> "$PROPS.new"
          mv "$PROPS.new" "$PROPS"
          cat "$PROPS"

      - name: Build APK
        if: ${{ inputs.format == 'apk' }}
        run: pnpm exec tauri android build --apk

      - name: Build AAB
        if: ${{ inputs.format == 'aab' }}
        run: pnpm exec tauri android build --aab

      - name: Locate output
        id: findout
        run: |
          if [ "${{ inputs.format }}" = "apk" ]; then
            OUT=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-${{ inputs.build_type }}*.apk' ! -name '*unsigned*' | head -n 1)
          else
            OUT=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*${{ inputs.build_type }}*.aab' | head -n 1)
          fi
          if [ -z "$OUT" ]; then
            echo "::error::No ${{ inputs.format }} found under src-tauri/gen/android/app/build/outputs"
            find src-tauri/gen/android/app/build/outputs -maxdepth 5 -type f
            exit 1
          fi
          echo "Found: $OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature (release APK only)
        if: ${{ inputs.format == 'apk' && inputs.build_type == 'release' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --verbose "${{ steps.findout.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-${{ inputs.format }}
          path: ${{ steps.findout.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Clean keystore (paranoia)
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" src-tauri/gen/android/key.properties
