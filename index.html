<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <!-- YouTube Playables SDK - kept ONLY on the Playgama build, which IS the
       Playables submission (Playgama forwards that one archive to YouTube).
       Stripped everywhere else by vite.config.ts.

       Load-bearing twice over. YouTube's integration requirements say the SDK
       MUST load before any game code executes; and the Playgama Bridge's own
       `youtube` adapter polls for `window.ytgame` on a 100 ms interval with NO
       timeout, so without this tag `bridge.initialize()` never settles and
       Playables shows a blank screen with every other check green.

       IN <head>, AND FIRST, on purpose. Vite injects the entry bundle as a
       `<script type="module">` into the head at build time — so a tag placed
       down in <body> with the other portal SDKs loads AFTER the game's own
       code in document order, which is the thing the requirement forbids.
       A classic (non-module) script here is parser-blocking and modules are
       deferred regardless, so this is guaranteed to run first. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!-- Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
       classic (non-module) tag: module scripts are deferred, so a shim installed
       from inside the module graph runs after the entry chunk's static imports.
       On YouTube Playables `window.localStorage` is NULL, and `main.ts` hands it
       straight to `new SaveManager(...)`, which binds its methods in the
       constructor — a blank screen before the splash clears. Ships on every
       build: sandboxed iframes and blocked-storage embeds fail the same way.
       Vite rewrites the path to `./js/storage-shim.js` under `--base=./`. -->
  <script src="/js/storage-shim.js"></script>
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12306e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mega Adventure">
  <meta name="description" content="Beam into machine-infested sectors as Cobalt, a blue combat android. Explore, blast rogue robots with your charge buster, loot chests, take on missions and upgrade your circuits.">
  <link rel="manifest" href="/manifest.json">
  <title>Mega Adventure</title>
  <style>
      /* The splash paints before any JS runs, so its styles are inlined here.
         It is the same picture FLogoProgress.vue draws (helmet emblem, title,
         the 28-cell bar) at the same size in the same place, so the handover
         when Vue mounts does not move anything. Change one, change both. */
      body {
          margin: 0;
          background-color: #12306e;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: radial-gradient(circle at 50% 36%, #2a63d8 0%, #12306e 55%, #0a1224 100%);
          transition: opacity 0.4s ease-out;
          font-family: 'Segoe UI', system-ui, sans-serif;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      .s-grid {
          position: absolute;
          inset: -64px 0 0 -64px;
          background-image: linear-gradient(rgba(120, 210, 255, 0.12) 2px, transparent 2px), linear-gradient(90deg, rgba(120, 210, 255, 0.12) 2px, transparent 2px);
          background-size: 64px 64px;
          animation: s-pan 6s linear infinite;
      }

      @keyframes s-pan { to { transform: translate3d(64px, 64px, 0); } }

      .s-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: clamp(0.4rem, 2vmin, 0.9rem);
          width: min(88vw, 460px);
      }

      .s-helm {
          position: relative;
          width: clamp(88px, 26vmin, 150px);
          aspect-ratio: 1;
          border-radius: 50% 50% 46% 46%;
          background: radial-gradient(circle at 35% 28%, #7fb2ff 0%, #2f73f0 38%, #1f4fc0 100%);
          border: 4px solid #141a33;
          box-sizing: border-box;
          box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
          animation: s-bob 2.4s ease-in-out infinite;
      }

      .s-face {
          position: absolute;
          left: 17%; right: 17%; top: 38%; bottom: 6%;
          border-radius: 38% 38% 48% 48%;
          background: #ffd2a8;
          border: 3px solid #141a33;
      }

      .s-title {
          margin: 0;
          font-size: clamp(2.2rem, 11vmin, 4.2rem);
          font-weight: 900;
          color: #fff;
          text-shadow: 0 4px 0 #141a33;
          letter-spacing: 0.02em;
      }

      .s-bar {
          width: 100%;
          height: clamp(16px, 3.4vmin, 24px);
          border: 3px solid #141a33;
          border-radius: 6px;
          background: #0b1433;
          box-sizing: border-box;
      }

      @keyframes s-bob {
          0%, 100% { transform: translateY(0) rotate(-2deg); }
          50% { transform: translateY(-6%) rotate(2deg); }
      }

      @media (prefers-reduced-motion: reduce) {
          .s-grid, .s-helm { animation: none; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="s-grid" aria-hidden="true"></div>
  <div class="s-card">
    <div class="s-helm" aria-hidden="true"><div class="s-face"></div></div>
    <p class="s-title">MEGA</p>
    <div class="s-bar"></div>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- No Playgama Bridge tag: v2 is bundled from the @playgama/bridge npm package
     (src/utils/playgamaBridgeLoader.ts). The v1 CDN script fetched its adapter
     chunks from bridge.playgama.com at runtime and injected them as script tags,
     neither of which YouTube Playables allows — and Playgama QA rejects v1. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
