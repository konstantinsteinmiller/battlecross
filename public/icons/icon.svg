  <!-- Mega Droid app icon: Flux's visor head in the hex reactor badge.
       ONE file for every size. Below 41 CSS px (a browser tab) a media query,
       evaluated against the image's own size, swaps the badge (.d) for a bold
       head that fills the tile (.s). The tile itself is .bg, so
       scripts/render-icons.mjs can square it off for the full-bleed maskable
       and apple-touch renders. Edit this file, then run that script: every
       PNG and favicon.ico is rendered from it. -->
