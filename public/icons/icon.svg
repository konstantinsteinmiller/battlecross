    <radialGradient id="b" cx="50%" cy="42%" r="64%">
      <stop offset="0" stop-color="#24397a"/>
      <stop offset=".56" stop-color="#122150"/>
      <stop offset="1" stop-color="#0a1224"/>
    </radialGradient>
    <radialGradient id="g" cx="50%" cy="44%" r="46%">
      <stop offset="0" stop-color="#ffa733" stop-opacity=".32"/>
      <stop offset="1" stop-color="#ffa733" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>.s{display:none}@media (max-width:40px){.d{display:none}.s{display:inline}}</style>
