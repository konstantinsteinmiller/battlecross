<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="75%">
      <stop offset="0" stop-color="#2a63d8"/>
      <stop offset="0.55" stop-color="#12306e"/>
      <stop offset="1" stop-color="#0a1224"/>
    </radialGradient>
    <radialGradient id="helm" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#8fc0ff"/>
      <stop offset="0.4" stop-color="#2f73f0"/>
      <stop offset="1" stop-color="#1a44b0"/>
    </radialGradient>
    <radialGradient id="ear" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.45" stop-color="#7ff4ff"/>
      <stop offset="1" stop-color="#1f9fd8"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ecff"/>
      <stop offset="1" stop-color="#7fb2ff"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g stroke="#78d2ff" stroke-opacity="0.12" stroke-width="6">
      <path d="M0 96H512M0 192H512M0 288H512M0 384H512M0 480H512M96 0V512M192 0V512M288 0V512M384 0V512M480 0V512"/>
    </g>
    <!-- helmet -->
    <path d="M256 70c-104 0-172 78-172 176v84c0 34 18 58 46 70h252c28-12 46-36 46-70v-84c0-98-68-176-172-176z"
          fill="url(#helm)" stroke="#141a33" stroke-width="16" stroke-linejoin="round"/>
    <!-- center fin stripe -->
    <path d="M232 78c8-4 40-4 48 0l6 128c-14 10-46 10-60 0z" fill="url(#fin)" stroke="#141a33" stroke-width="10" stroke-linejoin="round"/>
    <!-- face opening -->
    <path d="M150 262c0-26 20-44 46-44h120c26 0 46 18 46 44v74c0 52-44 88-106 88s-106-36-106-88z"
          fill="#ffd2a8" stroke="#141a33" stroke-width="14" stroke-linejoin="round"/>
    <!-- eyes -->
    <g stroke="#141a33" stroke-width="8">
      <ellipse cx="212" cy="300" rx="26" ry="34" fill="#ffffff"/>
      <ellipse cx="300" cy="300" rx="26" ry="34" fill="#ffffff"/>
    </g>
    <ellipse cx="218" cy="306" rx="14" ry="20" fill="#2468f0"/>
    <ellipse cx="294" cy="306" rx="14" ry="20" fill="#2468f0"/>
    <circle cx="222" cy="296" r="6" fill="#ffffff"/>
    <circle cx="298" cy="296" r="6" fill="#ffffff"/>
    <!-- ear discs -->
    <g stroke="#141a33" stroke-width="12">
      <circle cx="96" cy="286" r="46" fill="url(#ear)"/>
      <circle cx="416" cy="286" r="46" fill="url(#ear)"/>
    </g>
    <circle cx="96" cy="286" r="16" fill="#1f4fc0"/>
    <circle cx="416" cy="286" r="16" fill="#1f4fc0"/>
    <!-- helmet gloss -->
    <path d="M150 150c20-36 56-58 82-62" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
