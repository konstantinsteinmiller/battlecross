# Battlecross's OWN leaderboard Worker and database. Both carry this game's
# slug. This folder was copied from the predecessor's repo and used to point at
# ITS live Worker and D1 database: a `wrangler deploy` with those names would
# have replaced that game's Worker and written this game's rows into its data.
# Never reuse another game's `name`, `database_name` or `database_id` here.
name = "battlecross-leaderboard"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Pinned, so a later `wrangler login` on another of the studio's accounts
# cannot deploy this Worker somewhere else.
account_id = "7c5ee6a28676c02440e38e4f3e7bbb15"

[[d1_databases]]
binding = "DB"
database_name = "battlecross-leaderboard"
# Created 2026-10-02 with `wrangler d1 create battlecross-leaderboard`.
database_id = "2c3d77e8-efc6-422e-80af-5759419536ca"

[vars]
# Empty = allow any origin. Every portal build serves the game from a different
# origin and a sandboxed iframe sends `null`, so an allowlist is opt-in.
ALLOWED_ORIGINS = ""
# SCORE_SECRET is a SECRET, not a var: `wrangler secret put SCORE_SECRET`.
